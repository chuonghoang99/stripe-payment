<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Checkout Demo</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
        h1 { font-size: 1.4rem; }
        label { display: block; margin: 12px 0 4px; font-weight: 600; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        .row { display: flex; gap: 12px; }
        .row > div { flex: 1; }
        .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-weight: 600; }
        .check input { width: auto; }
        .buttons { display: flex; gap: 12px; margin-top: 20px; }
        button { flex: 1; padding: 12px; color: #fff; border: 0; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        button.primary { background: #635bff; }
        button.secondary { background: #0a7d3c; }
        button.mini { flex: 0 0 auto; padding: 4px 10px; font-size: .8rem; background: #666; }
        button:disabled { opacity: .6; cursor: default; }
        .hint { color: #666; font-size: .85rem; margin-top: 4px; }
        .key { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .key code { flex: 1; background: #f4f4f8; padding: 6px 8px; border-radius: 6px; word-break: break-all; }
        .error { color: #c0392b; margin-top: 12px; }
        #result { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; }
        #result.ok { background: #eefaf0; border: 1px solid #b6e3c2; }
        #result.dup { background: #fff6e6; border: 1px solid #f0d08a; }
        #result a { display: inline-block; margin-top: 8px; font-weight: 600; }
    </style>
</head>
<body>
<h1>💳 Stripe Checkout Demo</h1>
<p class="hint">Điền thông tin, chọn thanh toán một lần hoặc đăng ký định kỳ.</p>

<label for="name">Tên sản phẩm</label>
<input id="name" value="Áo thun demo"/>

<div class="row">
    <div>
        <label for="amount">Số tiền (đơn vị nhỏ nhất)</label>
        <input id="amount" type="number" value="150000"/>
    </div>
    <div>
        <label for="quantity">Số lượng</label>
        <input id="quantity" type="number" value="1"/>
    </div>
</div>

<div class="row">
    <div>
        <label for="currency">Tiền tệ</label>
        <select id="currency">
            <option value="vnd">VND</option>
            <option value="usd">USD</option>
        </select>
    </div>
    <div>
        <label for="interval">Chu kỳ (nếu định kỳ)</label>
        <select id="interval">
            <option value="month">Hàng tháng</option>
            <option value="year">Hàng năm</option>
        </select>
    </div>
</div>

<label for="coupon">Coupon ID (tùy chọn)</label>
<input id="coupon" placeholder="vd: abc123 — để trống nếu không dùng"/>

<div class="check">
    <input id="allowPromo" type="checkbox"/>
    <label for="allowPromo" style="margin:0">Cho khách tự nhập mã giảm giá trên trang Stripe</label>
</div>

<label>Idempotency-Key (gửi qua HTTP header)</label>
<div class="key">
    <code id="idemKey"></code>
    <button class="mini" onclick="newKey()">Đổi key</button>
</div>
<p class="hint">Bấm nút thanh toán 2 lần với <b>cùng key</b> để thấy request thứ hai
    trả về đơn cũ (<code>duplicate: true</code>) — không tạo phiên mới.</p>

<div class="buttons">
    <button class="primary" onclick="submit('/product/v1/checkout')">Thanh toán 1 lần</button>
    <button class="secondary" onclick="submit('/product/v1/subscribe')">Đăng ký định kỳ</button>
</div>
<p id="error" class="error"></p>

<div id="result"></div>

<script>
    // Sinh idempotency key khi tải trang; giữ nguyên cho tới khi bấm "Đổi key".
    function newKey() {
        const k = crypto.randomUUID();
        document.getElementById('idemKey').textContent = k;
        return k;
    }
    newKey();

    async function submit(endpoint) {
        const err = document.getElementById('error');
        const result = document.getElementById('result');
        const btns = document.querySelectorAll('button');
        err.textContent = '';
        result.style.display = 'none';
        btns.forEach(b => b.disabled = true);

        const coupon = document.getElementById('coupon').value.trim();
        const body = {
            name: document.getElementById('name').value,
            amount: Number(document.getElementById('amount').value),
            quantity: Number(document.getElementById('quantity').value),
            currency: document.getElementById('currency').value,
            interval: document.getElementById('interval').value,
            couponId: coupon || null,
            allowPromotionCodes: document.getElementById('allowPromo').checked
        };

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Idempotency-Key': document.getElementById('idemKey').textContent
                },
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                // Đọc ProblemDetail: { detail, code, requestId, status, ... }
                let msg = 'HTTP ' + res.status;
                try {
                    const err = await res.json();
                    msg = (err.detail || err.title || msg) + (err.code ? ' (' + err.code + ')' : '');
                } catch (_) { /* body không phải JSON */ }
                throw new Error(msg);
            }
            const data = await res.json();

            result.className = data.duplicate ? 'dup' : 'ok';
            result.style.display = 'block';
            result.innerHTML =
                (data.duplicate
                    ? '⚠️ <b>Request trùng</b> (cùng Idempotency-Key) → trả về đơn cũ, không tạo phiên mới.<br>'
                    : '✅ Đã tạo đơn mới.<br>') +
                'orderRef: <code>' + data.orderRef + '</code> · trạng thái: <code>' + data.orderStatus + '</code>' +
                (data.sessionUrl ? '<br><a href="' + data.sessionUrl + '">→ Mở trang thanh toán</a>' : '');
        } catch (e) {
            err.textContent = 'Lỗi: ' + e.message;
        } finally {
            btns.forEach(b => b.disabled = false);
        }
    }
</script>
</body>
</html>
