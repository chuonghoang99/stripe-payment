spring:
  application:
    name: stripe-payment
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/stripe_payment}
    username: ${DB_USER:stripe}
    password: ${DB_PASSWORD:stripe}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway quản lý schema; Hibernate chỉ kiểm tra khớp
    open-in-view: false
  flyway:
    enabled: true

stripe:
  secretKey: ${STRIPE_SECRET_KEY:xxx}
  webhookSecret: ${STRIPE_WEBHOOK_SECRET:xxx}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}